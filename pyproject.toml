[project]
name = "mujoco-puzzle-gym"
version = "0.1.0"
description = "An agent-driven MuJoCo puzzle lab: build stateful puzzle rooms, check they are solvable, train a policy and diagnose failures. First body: Microduck (unofficial)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "better-actuator-models==1.0.3",
    "gymnasium>=1.4.0",
    "imageio[ffmpeg]>=2.38.1",
    "matplotlib>=3.11.2",
    "mujoco>=4.0.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pyyaml>=6.0.3",
    "stable-baselines3>=2.9.2",
    "torch>=2.15.0",
]

[project.scripts]
mpg = "mujoco_puzzle_gym.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
