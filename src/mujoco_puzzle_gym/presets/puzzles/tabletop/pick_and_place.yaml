# Tabletop pick and place (M4 R61): the first room where a body with no legs does
# something to an object. Pick the block up, put it in the box, and the box opens the way
# to the target.
#
# This room is the one that answers the question the reach room could not: the weld grab
# (R18) was written for a beak on the front of a walking trunk, and nothing had measured
# it on a jaw that *is* the body. Measured: 20/20 seeds, mean 2.9 s. Before the shared
# approach learned that this body is holonomic it was 0/20 - the carrier closes in at
# `SLOW = -0.5`, which on a symmetric command mapping is half speed backwards, so the arm
# drove away from the block it was told to pick up.
#
# Numbers follow the measured envelope (docs/bodies.md section 9): base at x = -0.3, so
# the block at (-0.05, -0.12) is 0.29 m out and the box at (0.0, 0.14) is 0.33 m out, both
# inside the 0.48 m reach and clear of the fold near the base where tracking degrades. The
# block is 3 cm and 20 g; the jaw's own footprint is 5 cm.
#
# **Known defect, measured 2026-11-17 (M5): winning this room does not require the block.**
# Success in this environment is "a part with `role: goal` is satisfied", and every shipped
# room makes its puzzle by putting a door in the way. That does not transfer to this body:
# anything behind a door here is outside its 0.48 m ring, so the door at 0.42 m (0.72 m
# from the base) is scenery and the goal in front of it is reachable from the start. With
# the demo cut down to a single `goto goal` step the room still succeeded 5/5.
#
# What the 20/20 below did measure is the scripted solver, which works through the demo in
# order and cannot skip a step: before the holonomic fix in `carry.steer` it could not
# complete `grab block` and scored 0/20. So the grab and the carry are measured; the win
# condition is not. Gating the goal with `enable: box.ok` was tried and is not a fix - the
# solver then fails at the grab step (demo_step 0, the block never moves), and no shipped
# room gates a goal, so the machinery is untested. A part whose `role` is goal and whose
# satisfaction *is* a channel is the fix, and it is a requirement of its own.
#
# `box.ok` is the channel, not `box`: a receptacle writes `.ok`, `.count`, `.mass` and
# `.wrong`, and reading the bare name is rejected by the `channels` stage.
name: table_pick
size: [1.0, 0.8]
wall: {thickness: 0.02, height: 0.1}
spawn: {pos: [-0.3, 0.0], yaw: 0.0}
parts:
  - {name: block, type: cube, pos: [-0.05, -0.12], size: 0.03, mass: 0.02}
  - {name: box, type: receptacle, pos: [0.0, 0.14], size: [0.12, 0.12], accept: [block]}
  - {name: door, type: door, mode: oneshot, pos: [0.42, 0.0], width: 0.2, axis: y, in: [box.ok]}
  - {name: goal, type: goal, pos: [-0.02, 0.0], radius: 0.05}
demo:
  - grab block
  - place block box
  - goto goal
