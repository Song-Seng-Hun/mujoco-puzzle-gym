# Tethered start (R31): the duck starts tied to a post. Walking off pulls the
# rope past its 0.9 N limit and it snaps, which fails (`on_snap: fail`). The
# button within the rope's reach unties the rope from the post; then go to the
# goal. The loose rope end trails behind the duck.
name: tethered_start
size: [4.0, 1.5]
wall: {thickness: 0.06, height: 0.25}
spawn: {pos: [-1.5, 0.0], yaw: 0.0, random: [0.03, 0.05, 0.2]}
parts:
  - {name: post, type: anchor, pos: [-1.75, 0.0]}
  - {name: rope, type: rope, pos: [-1.5, 0.5], a: body, b: post, length: 0.6, on_snap: fail, detach_b: button}
  - {name: button, preset: input/floor_momentary, pos: [-1.6, -0.45], trigger: body}
  - {name: goal, type: goal, pos: [1.4, 0.0], radius: 0.15, random: [0.05, 0.1]}
demo:
  - press button
  - goto goal
