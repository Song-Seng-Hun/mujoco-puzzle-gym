# Jam the turret (R34 `peck` on an R33 source): the clock source standing by the
# wall drives the side wind that sweeps the corridor to the goal. Break the source
# and the wind has nothing to turn it on with, so the way is calm. The source's own
# box is what stops the duck while it pecks (0.2 m high, so the lowered beak tip at
# 0.135 m reaches it; walking into a free-standing box leaves the beak 4.4 cm off,
# hence `peck_dist: 0.06`, measured 2026-11-14).
# Task: examples/task_jam_the_turret.yaml (`head` and `grab`).
name: jam_the_turret
size: [3.2, 2.0]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.2, -1.0], to: [0.2, -0.3]}      # the corridor the wind sweeps
  - {from: [0.2, 0.3], to: [0.2, 1.0]}
spawn: {pos: [-1.3, 0.0], yaw: 0.0, random: [0.08, 0.1, 0.5]}
parts:
  - {name: tick, preset: logic/source_clock, pos: [-0.75, 0.62], period: 3.0, duty: 0.6,
     body: true, size: [0.1, 0.1], height: 0.2, by: [peck], breakable: true, peck_dist: 0.06}
  - {name: gust, type: wind, pos: [0.55, 0.0], size: [0.6, 0.5], yaw: 90.0, power: 6.0,
     in: [tick]}
  - {name: goal, type: goal, pos: [1.3, 0.0], radius: 0.15, random: [0.08, 0.3]}
demo: [break tick via peck, goto goal]
