# Split the beam (R100, R101): one lamp, two doors, and not enough light for both. The
# splitter sends `split` of the power straight on through a filter to `eye_a` and reflects
# the rest down to `eye_b`; both cells want 0.5. The two floor plates set the share, and the
# goal is behind the door that `eye_b` opens.
#
# Measured in this room (2026-11-17), as the power each cell read:
#
#     split   eye_a (through the 0.8 filter)   eye_b (reflected, 10 % loss)
#     0.5     0.400  dark                     0.450  dark          <- nothing pressed
#     0.8     0.640  **open**                 0.180  dark          <- plate_a, the dead end
#     0.2     0.160  dark                     0.720  **open**      <- plate_b, the goal
#
# So the room has three outcomes and only one of them is the answer. Solver: 20/20 at a mean
# of 11.1 s with `press plate_b`; **0/5** with the demo cut to a single `goto goal` step; and
# **0/5** with `press plate_a` instead - the wrong share opens a door into a dead end and
# leaves the one that matters shut. `mpg check --all-bodies` calls it exclusive.
#
# Why the filter is here. Without it both branches would be symmetric and the choice would be
# arithmetic-free; with it the two paths cost differently, which is the whole point of a
# splitter that loses power. And a filter is not a shutter: a wall or a closed door already
# stops a beam dead (measured in the probe room, and locked in
# `tests/test_optics.py::test_a_closed_door_is_already_a_shutter`), so dimming is the only
# thing left for it to do.
#
# One measured correction sits under this room. The first version counted a filter crossing
# against `bounces`, so with `bounces: 1` the straight branch died *at* the filter and
# `eye_a` read 0.000 at every setting: "the wrong plate fails" was then a control over a
# branch that could never work at all - the same vacuous control R92 was withdrawn for.
# `bounces` now counts turns only, and going straight through a panel is free.
name: split_the_beam
size: [3.0, 2.0]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.8, -1.0], to: [0.8, -0.75]}
  - {from: [0.8, -0.25], to: [0.8, 0.25]}
  - {from: [0.8, 0.75], to: [0.8, 1.0]}
  - {from: [0.8, 0.0], to: [1.5, 0.0]}
spawn: {pos: [-1.2, -0.6], yaw: 0.0}
parts:
  - {name: lamp, type: emitter, pos: [-1.3, 0.8], yaw: 0.0, power: 1.0, bounces: 1,
     height: 0.06}
  - {name: half, type: splitter, pos: [-0.2, 0.8], yaw: 45.0, width: 0.24, split: 0.5,
     loss: 0.1}
  - {name: tint, type: filter, pos: [0.2, 0.8], yaw: 0.0, width: 0.24, transmission: 0.8}
  - {name: eye_a, type: photocell, pos: [0.6, 0.8], min_power: 0.5}
  - {name: eye_b, type: photocell, pos: [-0.2, 0.2], min_power: 0.5}
  - {name: plate_a, preset: input/floor_toggle, pos: [-1.0, -0.6], size: [0.3, 0.3]}
  - {name: plate_b, preset: input/floor_toggle, pos: [-0.4, -0.6], size: [0.3, 0.3]}
  - {name: set_a, type: setter, pos: [-1.0, -0.95], in: [plate_a], target: half.split,
     value: 0.8}
  - {name: set_b, type: setter, pos: [-0.4, -0.95], in: [plate_b], target: half.split,
     value: 0.2}
  - {name: door_a, preset: device/sliding_door, pos: [0.8, 0.5], in: [eye_a], width: 0.5}
  - {name: door_b, preset: device/sliding_door, pos: [0.8, -0.5], in: [eye_b], width: 0.5}
  - {name: goal, type: goal, pos: [1.3, -0.6], radius: 0.15}
demo:
  - press plate_b
  - goto goal
