# Aim the mirror (R99, re-aimed in R140): the lamp sends its beam across the top of the room,
# where it hits a mirror facing the wrong way, and the beam goes straight back. A floor dial
# turns the mirror a quarter turn per pass (`bind` on `tilt.yaw`), and only one of its four
# cells sends the beam down onto the photocell, which opens the door. The room is the one
# whose answer is a *direction*: nothing is carried, nothing is weighed, and the only thing
# that changes is where the light goes.
#
# **R140 is why it is a dial and not a floor plate.** The first version turned the mirror with
# one `floor_toggle` and a `setter`, and its control was "cut the demo to `goto goal`" - which
# a uniform random policy passed: **11 of 20**. A wandering body stepped on the plate by
# accident and strolled through the opened door, so the room asked nothing about direction and
# the control measured the wrong thing (it showed that *doing nothing* fails, never that
# *aiming wrong* fails). The dial has four cells and the body pushes one spoke per pass, so a
# wrong choice is a wrong direction rather than a missing step.
#
# Measured (M8 R140, 2026-11-18):
#
#   right cell (`turn aim 1`)   **20/20, mean 33.4 s** (the dial walk is most of it)
#   wrong cell (`turn aim 2`)   **0/5**   <- the control the room was missing
#   no dial at all               0/5      <- the old control, still true
#   uniform random, 20 seeds    **1/20**  (it was 11/20)
#   `--all-bodies`              exclusive: the arm is refused by name for `walk`, and the two
#                               larger walking bodies fail the solver here
#
# The task file carries 55 s because the dial costs 33.4 of it; at the old 40 s there was no
# margin for a slow pass.
#
# Three things in this layout are measurements rather than taste:
#
#   - **The beam never crosses the route.** It runs along y = 0.8 and then down x = 0.2, and
#     the body walks the y = -0.6 corridor, so the body cannot break its own door open by
#     standing in the light. Every optical part is on the near side of the dividing wall for
#     the same reason: the wall stops light as surely as it stops the body.
#   - **The mirror starts at cell 0, yaw 0.** A beam arriving head-on goes back the way it
#     came, so the cell is dark until the dial reaches its second cell (45 deg).
#   - **`min_power` 0.5 with one 5 % reflection.** 0.95 arrives, so the cell has margin; the
#     number is there to say the room asks *how much* light, not only whether any.
#
# The planner cannot trace a ray. A photocell on its own reads as an input nothing can turn
# on ("unreachable: ['eye']", which is how this room first failed the `order` stage), so the
# emitter claims its cells are lit once the aiming parts' own inputs are on - see
# `Emitter.add_room_parts`. The claim is coarse; the 20/20 above is what measures the beam.
name: aim_the_mirror
size: [3.0, 2.0]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.6, -1.0], to: [0.6, -0.9]}
  - {from: [0.6, -0.3], to: [0.6, 1.0]}
spawn: {pos: [-1.2, -0.6], yaw: 0.0}
parts:
  - {name: lamp, type: emitter, pos: [-1.3, 0.8], yaw: 0.0, power: 1.0, bounces: 1,
     height: 0.06}
  - {name: tilt, type: mirror, pos: [0.2, 0.8], yaw: 0.0, width: 0.24,
     bind: {yaw: {from: aim.angle, map: [0, 3, 0, 135]}}}
  - {name: eye, type: photocell, pos: [0.2, 0.2], min_power: 0.5}
  - {name: aim, preset: beak/dial, pos: [-0.8, -0.5], facing: 180, spokes: 4, target: [1, 1]}
  - {name: door, preset: device/sliding_door, pos: [0.6, -0.6], in: [eye], width: 0.6}
  - {name: goal, type: goal, pos: [1.3, -0.6], radius: 0.15}
demo:
  - turn aim 1
  - goto goal
