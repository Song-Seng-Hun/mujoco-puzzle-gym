# Bowling (R38): three pins; knocking any one down (`<pin>.down`) opens the
# door. Push the ball into the pins (walking into them works too).
name: bowling
size: [2.4, 1.8]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.5, -0.9], to: [0.5, -0.28]}
  - {from: [0.5, 0.28], to: [0.5, 0.9]}
spawn: {pos: [-0.9, -0.5], yaw: 0.0, random: [0.1, 0.1, 3.14]}
parts:
  - {name: ball, type: ball, pos: [-0.35, -0.05], mass: 0.1, random: [0.05, 0.05]}
  - {name: pin_a, type: pin, pos: [-0.35, 0.45]}
  - {name: pin_b, type: pin, pos: [-0.43, 0.58]}
  - {name: pin_c, type: pin, pos: [-0.27, 0.58]}
  - {name: door, type: door, pos: [0.5, 0.0], width: 0.5, axis: y,
     in: [pin_a.down, pin_b.down, pin_c.down], require: any}
  - {name: goal, type: goal, pos: [0.9, 0.0], radius: 0.15, random: [0.1, 0.4]}
demo:                             # scripted solver (R20)
  - push ball to pin_a
  - goto goal
