# Color sort (R38): a red and a blue ball, a net for each colour. The door
# opens when both nets hold their ball; then walk to the goal.
# The spec names an R8b counter for the door; a counter of the two `.scored`
# pulses is planned optimistically by the order check (one net would look
# enough), so the door reads both nets with `require: all` instead.
name: color_sort
size: [2.4, 1.8]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.5, -0.9], to: [0.5, -0.28]}
  - {from: [0.5, 0.28], to: [0.5, 0.9]}
spawn: {pos: [-0.4, -0.3], yaw: 1.57, random: [0.1, 0.1, 0.5]}
parts:
  - {name: red_ball, type: ball, color: red, pos: [-0.7, 0.3], random: [0.05, 0.05]}
  - {name: blue_ball, type: ball, color: blue, pos: [-0.1, 0.3], random: [0.05, 0.05]}
  - {name: red_net, type: goal_net, accepts: [red], pos: [-0.7, 0.72], width: 0.4, facing: -90}
  - {name: blue_net, type: goal_net, accepts: [blue], pos: [-0.1, 0.72], width: 0.4, facing: -90}
  - {name: door, type: door, pos: [0.5, 0.0], width: 0.5, axis: y, in: [red_net, blue_net], require: all}
  - {name: goal, type: goal, pos: [0.9, 0.0], radius: 0.15, random: [0.1, 0.4]}
demo:                             # scripted solver (R20)
  - push red_ball to red_net
  - push blue_ball to blue_net
  - goto goal
