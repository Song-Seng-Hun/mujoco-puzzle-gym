# Two openings, one tank (R91): the divider has two gaps, each with a door, and both doors
# draw on the same `budget`. Opening the one you need gets you through; opening both spends
# the tank twice as fast and leaves you on the wrong side of a closed door.
#
# This room exists to use the one thing a `budget` adds that an expression cannot. Two of the
# three ways to spend were already expressible and are not what this asks: `count(x) < n` is
# a use budget today, and `timer(x) < s` is a time limit today. A pool that **several loads
# draw from** is not, because expressions refuse arithmetic between channels and so cannot
# add two timers.
#
# Measured (M6 R94, 2026-11-17, 20 seeds):
#
# - the room as it ships: **20/20** at a mean of 13.2 s;
# - the demo cut to a single `goto goal` step: **0/5**;
# - the same demo with `press t_dn` added, so both doors are open: **0/5**. That is the
#   measurement the room is about.
#
# And the control that says the tank is what blocks it, rather than the walk to the second
# toggle: open both doors on a larger tank and it comes back. At `amount: 18` (1.5x) it is
# still 0/5; at 24 (2x) it is 5/5 at 20.5 s. So the cost of the second door is close to the
# whole tank, not a fraction of it.
#
# One thing that does not work, measured first: `enable: tank` on the doors. `enable` stops a
# part's *output*, and a door whose output stops holds its panel where it is - so an open
# door stayed open after the tank emptied, and opening both doors still scored 5/5 at 20.5 s.
# The tank has to be an *input*: `in: [t_up, tank]` with `require: all` closes the door when
# the pool runs dry.
name: two_openings
size: [3.0, 1.8]
wall: {thickness: 0.06, height: 0.25}
walls:                            # divider at x = 0.2 with gaps at y = +-0.45
  - {from: [0.2, -0.9], to: [0.2, -0.68]}
  - {from: [0.2, -0.22], to: [0.2, 0.22]}
  - {from: [0.2, 0.68], to: [0.2, 0.9]}
spawn: {pos: [-1.2, 0.0], yaw: 0.0}
parts:
  - {name: t_up, preset: input/floor_toggle, pos: [-0.9, 0.5]}
  - {name: t_dn, preset: input/floor_toggle, pos: [-0.9, -0.5]}
  - {name: tank, type: budget, pos: [-1.3, 0.0], amount: 12.0, rate: 1.0,
     spend: time, loads: [t_up, t_dn], body: true}
  - {name: door_up, preset: device/sliding_door, pos: [0.2, 0.45], width: 0.46,
     in: [t_up, tank], require: all}
  - {name: door_dn, preset: device/sliding_door, pos: [0.2, -0.45], width: 0.46,
     in: [t_dn, tank], require: all}
  - {name: goal, type: goal, pos: [1.1, 0.0], radius: 0.15}
demo:
  - press t_up
  - goto goal
