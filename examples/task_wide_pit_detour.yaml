# Task for the room preset `puzzles/wide/pit_detour` (R47): the wide pit room, played by
# the body it was sized for. See `task_wide_switch_door.yaml` for why the body name lives
# in the task and not in the room.
#
# `episode_seconds` is 60, not the default 40. The detour is longer than a straight line
# and this body turns at 0.5 rad/s, so a change of heading costs seconds, not fractions
# of one: the room next door solves in 24.6 s on average with no detour at all.
room: ../src/mujoco_puzzle_gym/presets/puzzles/wide/pit_detour.yaml
body: go2
env: {hz: 10, episode_seconds: 60}
obs: [gravity, ang_vel, lin_vel, part_pos, part_state]
reward: {progress: 10.0, stage: 2.0, success: 10.0, fall: -5.0}
algo: ppo
net: [128, 128]
n_envs: 12
