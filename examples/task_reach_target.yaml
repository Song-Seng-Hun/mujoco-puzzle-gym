# Task for the room preset `puzzles/tabletop/reach_target` (M4 R61): the tabletop room,
# played by the body it was sized for. `body:` is the point of this file - a room carries
# dimensions, not a body name.
#
# `episode_seconds` is 10, not the default 40: the measured solution takes 0.6 s, and the
# end effector moves at most 0.15 m/s across a table 1 m wide.
#
# `termination: {fall: false}` because this body cannot fall. Leaving it on would arm a
# check that can never fire, which reads as if falling were a risk here.
room: ../src/mujoco_puzzle_gym/presets/puzzles/tabletop/reach_target.yaml
body: so101
env: {hz: 10, episode_seconds: 10}
obs: [gravity, ang_vel, lin_vel, part_pos, part_state]
reward: {progress: 10.0, stage: 2.0, success: 10.0, fall: -5.0}
termination: {success: true, fall: false}
algo: ppo
net: [128, 128]
n_envs: 12
