# Example room (R19, R28 `wall_button_beak_mid`): press a wall button with the
# beak to open the door.
# - The plate is centred 0.2 m up on the north wall; the level beak tip (0.21 m)
#   reaches it standing, so the default `actions: [move]` will do. The low preset
#   (`wall_button_beak_low`, 0.15 m) needs `head` in the task actions.
# - The button (oneshot) opens the sliding door in the divider (standard 0.50 m
#   opening, as in doors.yaml) to the goal.
name: wall_button
size: [2.4, 1.4]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.5, -0.7], to: [0.5, -0.28]}      # divider, opening at y = 0
  - {from: [0.5, 0.28], to: [0.5, 0.7]}
spawn: {pos: [-0.8, -0.35], yaw: 0.0, random: [0.08, 0.1, 0.8]}
parts:
  - {name: btn, preset: beak/wall_button_beak_mid, pos: [-0.3, 0.699], facing: -90}
  - {name: door, preset: device/sliding_door, pos: [0.5, 0.0], in: [btn]}
  - {name: goal, type: goal, pos: [0.9, 0.0], radius: 0.15, random: [0.08, 0.3]}
