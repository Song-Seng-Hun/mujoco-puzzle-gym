# Example room (R35 `shuffle_switches.yaml`): three plates, one door, and the
# wiring changes every episode.
# - `randomize: {shuffle: [...]}` draws which plate feeds the door, and swaps the
#   three plates' places so their order carries no information either.
# - The cue: the plate that is wired and the door are painted the same colour this
#   episode, and the obs item `part_links` says the same thing as a one-hot. A
#   room with `hidden: true` instead needs memory or search, which `mpg check`
#   warns about.
# - There is no `demo:`: the scripted answer follows the plan, which is built from
#   the drawn wiring, so it walks to the plate that works. A policy has to read
#   the cue instead.
# Task: examples/task_shuffle_switches.yaml (`[move]`, 40 s episodes).
name: shuffle_switches
size: [3.0, 2.0]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.5, -1.0], to: [0.5, -0.28]}     # divider, opening at y = 0
  - {from: [0.5, 0.28], to: [0.5, 1.0]}
spawn: {pos: [-1.2, 0.0], yaw: 0.0, random: [0.08, 0.1, 0.5]}
randomize:
  shuffle:
    - {links: door, from: [plate_a, plate_b, plate_c]}
    - {places: [plate_a, plate_b, plate_c]}
parts:
  - {name: plate_a, preset: input/floor_oneshot, pos: [-1.0, 0.6]}
  - {name: plate_b, preset: input/floor_oneshot, pos: [-0.5, 0.6]}
  - {name: plate_c, preset: input/floor_oneshot, pos: [-0.5, -0.6]}
  - {name: door, preset: device/sliding_door, pos: [0.5, 0.0], in: [plate_a]}
  - {name: goal, type: goal, pos: [1.1, 0.0], radius: 0.15, random: [0.08, 0.3]}
