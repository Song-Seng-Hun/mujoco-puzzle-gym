# Example room (R6, R21, R24 "four checkpoints"): reach flags 1, 2, 3, 4 in
# order, then the goal. The demo room of staged training: `mpg check` saves a
# snapshot at every flag (runs/check/four_flags/checkpoints/), and
# `mpg train --curriculum forward` trains segment by segment from them.
name: four_flags
size: [2.2, 1.6]
wall: {thickness: 0.06, height: 0.25}
walls:                            # two half walls make the route zigzag
  - {from: [-0.25, -0.8], to: [-0.25, 0.15]}
  - {from: [0.45, -0.15], to: [0.45, 0.8]}
spawn: {pos: [-0.85, -0.45], yaw: 1.57, random: [0.08, 0.08, 0.5]}
parts:
  - {name: flag_1, preset: input/checkpoint_flag, order: 1, pos: [-0.75, 0.45], random: [0.05, 0.05]}
  - {name: flag_2, preset: input/checkpoint_flag, order: 2, pos: [0.1, 0.5], random: [0.05, 0.05]}
  - {name: flag_3, preset: input/checkpoint_flag, order: 3, pos: [0.1, -0.45], random: [0.05, 0.05]}
  - {name: flag_4, preset: input/checkpoint_flag, order: 4, pos: [0.8, -0.45], random: [0.05, 0.05]}
  - {name: goal, type: goal, pos: [0.8, 0.45], radius: 0.15, random: [0.05, 0.05]}
