# Example room (R28 laundry demo): put both pieces of laundry into the basket
# and the door opens.
# - Each piece waits on a low stand (the raised "P" cells, 0.18 m: the beak tip
#   is 0.135-0.21 m high, so cloth lying on the floor is out of reach).
# - The basket (`count: 2`) opens the sliding door in the divider (standard
#   0.50 m opening, as in doors.yaml) to the goal. It stands in the south-east,
#   off the way to the door.
# - Two carries take the scripted solver about 31 s (median), so the task
#   examples/task_laundry.yaml gives 60 s episodes and `actions: [move, head, grab]`.
name: laundry
cell: 0.1
legend:
  "P": {type: floor, height: 0.18}
map: |
  ########################
  #................#.....#
  #................#.....#
  #...PP....PP.....#.....#
  #......................#
  #......................#
  #......................#
  #......................#
  #......................#
  #................#.....#
  #................#.....#
  #................#.....#
  ########################
spawn: {pos: [-0.75, -0.3], yaw: 1.57, random: [0.08, 0.08, 0.3]}
parts:
  - {name: cloth_a, preset: beak/laundry, pos: [-0.74, 0.3]}
  - {name: cloth_b, preset: beak/laundry, pos: [-0.14, 0.3]}
  - {name: basket, preset: beak/basket, pos: [0.2, -0.3], count: 2}
  - {name: door, preset: device/sliding_door, pos: [0.55, 0.0], in: [basket.ok]}
  - {name: goal, type: goal, pos: [0.85, 0.0], radius: 0.12, random: [0.05, 0.25]}
