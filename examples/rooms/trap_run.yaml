# Example room (R16, R24 "traps"): a walk past three traps to the goal.
# - A pit in the middle of the floor ends the episode if the body falls in;
#   the planner treats it as a hole and walks around it.
# - A spinning bar turns at floor height off the path; its sweep is a hole too.
# - A weak crosswind (0.5 N) pushes sideways on the way to the goal.
# Built from part presets (R3).
name: trap_run
size: [2.6, 1.8]
wall: {thickness: 0.06, height: 0.25}
spawn: {pos: [-1.0, 0.0], yaw: 0.0, random: [0.08, 0.1, 3.14]}
parts:
  - {name: pit_a, preset: trap/pit, pos: [-0.2, 0.0], size: [0.4, 0.5]}
  - {name: bar_a, preset: trap/spinning_bar, pos: [0.35, 0.55]}
  - {name: wind_a, preset: trap/crosswind, pos: [0.65, -0.1], size: [0.4, 0.9], power: 0.5}
  - {name: goal, type: goal, pos: [1.0, 0.0], radius: 0.15, random: [0.08, 0.3]}
