# Example room (R29, R24 "npc"): herd a fleeing robot onto the corner button.
# - The robot runs away from the body (within 0.4 m) and slides along walls; its
#   leash keeps it in the left room.
# - The momentary button in the top-left corner counts only robots
#   (`trigger: npc`); the door in the divider is open while the robot stands on it.
# - The solver walks round the robot, drives it into the corner from behind
#   (`demo: herd`), then walks through the door to the goal.
# Built from part presets (R3).
name: herd
size: [2.6, 1.8]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.4, -0.9], to: [0.4, -0.28]}      # divider, opening at y = 0
  - {from: [0.4, 0.28], to: [0.4, 0.9]}
spawn: {pos: [-1.0, -0.5], yaw: 0.0, random: [0.08, 0.1, 3.14]}
parts:
  - {name: corner, preset: input/floor_momentary, pos: [-1.15, 0.75], trigger: npc}
  - {name: bot, preset: npc/flee, pos: [-0.5, 0.2], random: [0.1, 0.1], leash: [-1.3, -0.9, 0.3, 0.9]}
  - {name: door_a, preset: device/sliding_door, pos: [0.4, 0.0], in: [corner]}
  - {name: goal, type: goal, pos: [1.0, 0.0], radius: 0.15, random: [0.08, 0.4]}
demo:
  - herd bot corner
