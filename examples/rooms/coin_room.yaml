# Example room (R36): pick up all three coins to open the door, then walk to the goal.
# The coin lock is an R8b counter on the group's `coins.picked` pulse; the door
# reads its `lock.reached` channel.
name: coin_room
size: [2.4, 1.8]                  # interior [m], centred at the origin
wall: {thickness: 0.06, height: 0.25}
walls:                            # divider at x = 0.3 with a 0.5 m opening at y = 0
  - {from: [0.3, -0.9], to: [0.3, -0.28]}
  - {from: [0.3, 0.28], to: [0.3, 0.9]}
spawn: {pos: [-0.8, 0.0], yaw: 0.0, random: [0.1, 0.2, 0.5]}
parts:
  - {name: coin_a, type: coin, pos: [-0.4, 0.4], random: [0.08, 0.08]}
  - {name: coin_b, type: coin, pos: [0.0, 0.35], random: [0.08, 0.08]}
  - {name: coin_c, type: coin, pos: [-0.05, -0.35], random: [0.08, 0.08]}
  - {name: lock, type: coin_lock, group: coins, need: all, pos: [0.2, 0.4]}
  - {name: door_b, type: door, pos: [0.3, 0.0], width: 0.5, axis: y, in: [lock.reached]}
  - {name: goal, type: goal, pos: [0.85, 0.0], radius: 0.15, random: [0.1, 0.4]}
