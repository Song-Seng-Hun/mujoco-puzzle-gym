# Example room (R24 `turret.yaml`, R16 cannon_turret, R28 lever): aim with a
# lever, fire with a button, hit the target, the door opens.
# - The push lever (cells -1, 0, 1, starts at -1) aims the turret 30 deg right,
#   straight or 30 deg left. Only straight (0) hits the target, so the body
#   pushes the lever over one cell, walks off, and steps on the fire button.
# - The target opens the door to the goal. `mpg check`'s ballistic check aims
#   per lever cell: the target must be hit by some cell.
name: turret
size: [3.0, 2.0]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.5, -1.0], to: [0.5, -0.28]}     # divider, opening at y = 0
  - {from: [0.5, 0.28], to: [0.5, 1.0]}
spawn: {pos: [-1.2, -0.6], yaw: 0.0, random: [0.08, 0.1, 0.8]}
parts:
  - {name: aim, preset: beak/lever, pos: [-0.5, -0.45], facing: 180}
  - {name: fire, preset: input/floor_momentary, pos: [-1.0, 0.25]}
  - {name: turret, preset: trap/cannon_turret, pos: [-1.2, 0.75], yaw: 0.0, in: [fire],
     aim_pitch: 17.0, bind: {aim_yaw: {from: aim.angle, map: [-1, 1, -30, 30]}}}
  - {name: board, preset: input/target, pos: [0.15, 0.75], yaw: 180.0}
  - {name: door, preset: device/sliding_door, pos: [0.5, 0.0], in: [board]}
  - {name: goal, type: goal, pos: [1.1, 0.0], radius: 0.15, random: [0.08, 0.3]}
demo: [turn aim 0, press fire]
