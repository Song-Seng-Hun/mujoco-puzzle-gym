# All five hardware items in one environment (R126): the arm, a contact grasp, and an
# observation a robot could actually produce.
#
#   - the room is `pick_by_hand`, so the block is held by **two fingers pressing it** and
#     the scene has no weld (R124, R125);
#   - `obs:` is `sensors_only` by `obs.obs_kind` - proprioception plus the gaze check on
#     the ArUco markers the room puts on the block, the box and the door (R27). The arm's
#     own wrist camera is what makes that gaze possible at all (R115);
#   - the goal is at a fixed spot in this room, so it needs no marker of its own;
#   - actuator latency and sensor noise are modelled and measurable (R118, R119), and left
#     at zero here so this task measures the observation and the grasp, not those.
#
# What this is and is not. The **environment** composes: it builds, it is `sensors_only`,
# and the scripted solution still carries it (the solver reads privileged state by design -
# it is the room's check, not a controller). What does **not** exist is a trained policy
# that solves it. Measured below in its own line, honestly, whatever it says.
room: ../src/mujoco_puzzle_gym/presets/puzzles/tabletop/pick_by_hand.yaml
body: so101
actions: [move, head, grab]
env: {hz: 10, episode_seconds: 40}
obs: [gravity, ang_vel, lin_vel, markers_seen]
reward: {progress: 10.0, stage: 2.0, success: 10.0, fall: -5.0}
termination: {success: true, fall: false}
algo: ppo
net: [128, 128]
n_envs: 12
