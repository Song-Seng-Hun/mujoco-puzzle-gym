# Broken on purpose: no switch is linked to the door, so it never opens.
# `mpg check` must fail (a) solution order.
name: door_unlinked
size: [2.4, 1.8]
wall: {thickness: 0.06, height: 0.25}
walls:
  - {from: [0.3, -0.9], to: [0.3, -0.28]}
  - {from: [0.3, 0.28], to: [0.3, 0.9]}
spawn: {pos: [-0.75, 0.0], yaw: 0.0, random: [0.2, 0.35, 3.14]}
parts:
  - {name: switch_a, type: switch, pos: [-0.25, 0.5], size: [0.3, 0.3]}
  - {name: door_b, type: door, pos: [0.3, 0.0], width: 0.5, axis: y}
  - {name: goal, type: goal, pos: [0.85, 0.0], radius: 0.15}
links: []
