# r25_order_hall: three checkpoint flags, a three-button order lock, and a warp that
# leads to the next room.
#
# - Flags 1-3 (`input/checkpoint_flag`, `order: 1, 2, 3`) run along the top edge and must
#   be reached in that order. `mpg check` saves a snapshot per flag in
#   runs/check/r25_order_hall/checkpoints/, which is what `mpg train --curriculum forward`
#   starts its segments from.
# - The order lock is a `sequence:` gate over the three oneshot floor buttons on the
#   bottom edge: only btn_a -> btn_b -> btn_c opens the door. `latch: true` is required,
#   because a sequence gate without it writes 1 for a single body step, which cannot hold
#   a `mode: follow` door open. A press out of order restarts the order, and an oneshot
#   button has no second rising edge, so the buttons sit on the bottom edge while the
#   flags sit on the top one: no route between two flags crosses a button.
# - Behind the door, a `to: next_stage` warp pad sends the body to the vault
#   (`stages: [r25_vault.yaml]`), which holds the goal. Stage rooms are built as zones of
#   one model side by side, so part names are unique across both files.
#
# `demo:` spells out the press order on purpose: the planner models a sequence gate as a
# plain AND of its inputs (gate.py `plan_values`), so the static solution order alone does
# not say which button comes first and the scripted solver would press them in plan order.
#
# Measured: `mpg check` (built-in task, 40 s episodes) 40/40 seeds, mean 32.9 s.
# `--task task_r25_order_hall.yaml` (60 s episodes) 20/20.
name: r25_order_hall
size: [2.2, 1.6]
wall: {thickness: 0.06, height: 0.25}
walls:                                  # divider at x = 0.45, 0.5 m gap at y = 0
  - {from: [0.45, -0.8], to: [0.45, -0.25]}
  - {from: [0.45, 0.25], to: [0.45, 0.8]}
stages: [r25_vault.yaml]
spawn: {pos: [-0.95, 0.0], yaw: 0.0, random: [0.06, 0.08, 0.5]}
parts:
  - {name: flag_1, preset: input/checkpoint_flag, order: 1, pos: [-0.85, 0.58], random: [0.04, 0.04]}
  - {name: flag_2, preset: input/checkpoint_flag, order: 2, pos: [-0.2, 0.58], random: [0.04, 0.04]}
  - {name: flag_3, preset: input/checkpoint_flag, order: 3, pos: [0.2, 0.58], random: [0.04, 0.04]}
  - {name: btn_a, preset: input/floor_oneshot, pos: [-0.85, -0.58], random: [0.04, 0.04]}
  - {name: btn_b, preset: input/floor_oneshot, pos: [-0.2, -0.58], random: [0.04, 0.04]}
  - {name: btn_c, preset: input/floor_oneshot, pos: [0.2, -0.58], random: [0.04, 0.04]}
  - {name: order_lock, type: gate, pos: [0.45, 0.6], sequence: [btn_a, btn_b, btn_c], latch: true}
  - {name: vault_door, preset: device/sliding_door, pos: [0.45, 0.0], in: [order_lock]}
  - {name: to_vault, type: warp, pos: [0.8, 0.0], to: next_stage, random: [0.04, 0.08]}
demo:
  - goto flag_1
  - goto flag_2
  - goto flag_3
  - press btn_a
  - press btn_b
  - press btn_c
